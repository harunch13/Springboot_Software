name: JHipster CI Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js for global tools
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pre-install global tools
        run: |
          npm install -g rimraf@2 webpack@2.5.0
          npm_prefix="$(npm config get prefix)"
          printf '%s\n' "$npm_prefix" >> "$GITHUB_PATH"

      - name: Set up legacy Node.js for the app
        uses: actions/setup-node@v4
        with:
          node-version: '6.11.0'

      - name: Create Maven Settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>nexus-releases</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
              <server>
                <id>nexus-snapshots</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build with Maven
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          PHANTOMJS_CDNURL: "https://npmmirror.com/mirrors/phantomjs/"
          OPENSSL_CONF: "/dev/null"
        run: ./mvnw -B clean verify

      - name: Fix Yarn Registry
        run: ./node/yarn/dist/bin/yarn config set registry https://registry.npmjs.org/ || true

      - name: Package Production WAR
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          PHANTOMJS_CDNURL: "https://npmmirror.com/mirrors/phantomjs/"
          OPENSSL_CONF: "/dev/null"
        run: ./mvnw -B package -Pprod -DskipTests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: great-big-example-app-prod
          path: target/*.war

  sonarqube:
    name: SonarQube Analysis
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '6.11.0'

      - name: Pre-install global tools
        run: |
          npm install -g rimraf@2 webpack@2.5.0
          echo "$(npm bin -g)" >> "$GITHUB_PATH"

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build and verify with JDK 8
        run: ./mvnw -B verify

      - name: Set up JDK 17 for Sonar
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Sonar Scan
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B sonar:sonar -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN" -Dsonar.organization=harunch13 -Dsonar.projectKey=harunch13_Springboot_Software

  publish-nexus:
    name: Publish to Nexus
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Set up legacy Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '6.11.0'

      - name: Pre-install global tools
        run: npm install -g rimraf@2 webpack@2.5.0

      - name: Create Maven Settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>nexus-releases</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Set up Maven for GitHub Packages
        uses: s4u/maven-settings-action@v2.8.0
        with:
          servers: '[{"id": "github","username": "${{ github.actor }}","password": "${{ secrets.GITHUB_TOKEN }}"}]'

      - name: Deploy to GitHub Packages
        run: ./mvnw -B deploy -DskipTests -Pprod -Dskip.installnodenpm -Dskip.yarn -Dskip.npm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         
  deploy-tomcat:
    name: Deploy to Tomcat
    needs: publish-nexus
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: great-big-example-app-prod
          path: ./deploy

      - name: Deploy WAR to Tomcat Manager
        env:
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
          TOMCAT_URL: ${{ secrets.TOMCAT_URL }}
        run: |
          WAR_FILE=$(ls ./deploy/*.war | head -n 1)
          curl --fail --show-error --silent \
            -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            -T "$WAR_FILE" \
            "$TOMCAT_URL/manager/text/deploy?path=/greatbigexampleapp&update=true"
