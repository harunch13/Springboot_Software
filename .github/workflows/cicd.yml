name: JHipster CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '6.11.0'

      - name: Pre-install global tools
        run: |
          npm install -g rimraf@2 webpack@2.5.0
          echo "$(npm bin -g)" >> $GITHUB_PATH

      - name: Create Maven Settings for Nexus and Sonar
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>nexus-releases</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
              <server>
                <id>nexus-snapshots</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
              <server>
                <id>tomcat-manager</id>
                <username>${{ secrets.TOMCAT_USER }}</username>
                <password>${{ secrets.TOMCAT_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build with Maven (Dev)
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          PHANTOMJS_CDNURL: "https://npmmirror.com/mirrors/phantomjs/"
          OPENSSL_CONF: "/dev/null"
        run: ./mvnw -B clean verify

      - name: Fix Yarn Registry
        run: ./node/yarn/dist/bin/yarn config set registry https://registry.npmjs.org/ || true

      - name: Package Production WAR
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          PHANTOMJS_CDNURL: "https://npmmirror.com/mirrors/phantomjs/"
          OPENSSL_CONF: "/dev/null"
        run: ./mvnw -B package -Pprod -DskipTests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: great-big-example-app-prod
          path: target/*.war

  sonarqube:
    name: SonarQube Analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: Maker Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build and verify with JDK 8
        run: ./mvnw -B verify

      - name: Set up JDK 17 for Sonar
        uses: actions/setup-java@v4
        with: 
          java-version: '17'
          distribution: 'temurin'
        
      - name: Sonar Scan
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B verify sonar:sonar -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN

  publish-nexus:
    name: Publish to Nexus
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Maker Maven Wrapper Executable
        run: chmod +x mvnw
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: great-big-example-app-prod
          path: target/
      - name: Deploy to Nexus
        run: ./mvnw -B deploy -DskipTests -Pprod

  deploy-tomcat:
    name: Deploy to Tomcat
    needs: publish-nexus
    runs-on: ubuntu-latest
    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: great-big-example-app-prod
          path: ./deploy
      - name: Deploy WAR to Tomcat Manager
        run: |
          WAR_FILE=$(ls ./deploy/*.war | head -n 1)
          curl -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
            -T "$WAR_FILE" \
            "${{ secrets.TOMCAT_URL }}/manager/text/deploy?path=/greatbigexampleapp&update=true"
